name: Release

# Builds the release DMG (universal, Release configuration) on a Mac and checks it end to end.
#
# Runs on version tags (v1.0.0…), on demand (Actions › Release › Run workflow), and on pushed
# commits whose message contains [release].
#
# Signing and notarization happen only when these repository secrets exist (Settings › Secrets and
# variables › Actions); without them the DMG is ad-hoc signed, for testing. See
# Documentation/Distribution.md › "Release builds on GitHub Actions".
#   MACOS_CERTIFICATE_P12        base64 of your "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD   the .p12's password
#   APPLE_TEAM_ID                your Team ID
#   NOTARY_KEY_P8                contents of an App Store Connect API key (AuthKey_XXXXXXXXXX.p8)
#   NOTARY_KEY_ID                that key's ID
#   NOTARY_ISSUER_ID             the issuer ID shown above the keys list (required: use a team key)

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Only runs that build share a group: a later push without [release] must not cancel a build that
# is under way (possibly mid-notarization). Runs that skip the build get a group of their own.
concurrency:
  group: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')) && format('release-{0}', github.ref) || format('skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build and check the DMG
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' }}
    outputs:
      dmg: ${{ steps.result.outputs.dmg }}
      notarized: ${{ steps.result.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && sw_vers

      - name: Restore universal libraries
        id: vendor
        uses: actions/cache/restore@v4
        with:
          path: Vendor/macos
          key: vendor-universal-${{ runner.os }}-${{ hashFiles('Scripts/build-deps-macos.sh') }}
      - name: Build universal libraries
        if: steps.vendor.outputs.cache-hit != 'true'
        run: Scripts/build-deps-macos.sh --universal
      - name: Save universal libraries
        if: steps.vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/macos
          key: ${{ steps.vendor.outputs.cache-primary-key }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # The Developer ID intermediate certificate completes the chain; fetch it if the runner lacks it.
          if ! security find-certificate -c "Developer ID Certification Authority" >/dev/null 2>&1; then
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          fi
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.+)"$/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12"; exit 1; }
          case "$IDENTITY" in *"($TEAM_ID)"*) ;; *) echo "::error::The certificate ($IDENTITY) doesn't belong to team $TEAM_ID"; exit 1 ;; esac
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare notarization credentials
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # This runner's notarytool (Xcode 16) only accepts team keys, which need the issuer ID.
          # Fail here rather than ship a signed but un-notarized DMG from a green run.
          [ -n "$ISSUER_ID" ] || { echo "::error::NOTARY_ISSUER_ID is missing: add the Issuer ID of your App Store Connect team key"; exit 1; }
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_ID=$KEY_ID"
            echo "NOTARY_ISSUER=$ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the release DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ARGS=()
          if [ -n "${SIGN_IDENTITY:-}" ]; then ARGS+=(--sign "$SIGN_IDENTITY" --team "$TEAM_ID"); fi
          if [ -n "${SIGN_IDENTITY:-}" ] && [ -n "${NOTARY_KEY_PATH:-}" ]; then ARGS+=(--notarize); fi
          Scripts/release.sh "${ARGS[@]}"

      - name: Run the app (launch, open an archive, quit; CLI and 7-Zip round trip)
        timeout-minutes: 10
        run: Scripts/smoke-test-app.sh dist/Zipper.app

      - name: Print small screenshots into the log
        # Base64 of downscaled JPEGs between markers, so the UI can be reviewed from the log alone.
        if: always()
        run: |
          for f in dist/screenshots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .png)
            sips -Z 1100 -s format jpeg -s formatOptions 60 "$f" --out "$RUNNER_TEMP/$name.jpg" >/dev/null
            echo "BEGIN-SCREENSHOT $name"
            base64 -b 120 -i "$RUNNER_TEMP/$name.jpg"
            echo "END-SCREENSHOT $name"
          done

      - name: Summary
        id: result
        if: always()
        run: |
          DMG=$(ls dist/Zipper-*.dmg 2>/dev/null | head -1 || true)
          [ -n "$DMG" ] || exit 0
          NOTARIZED=false
          xcrun stapler validate "$DMG" >/dev/null 2>&1 && NOTARIZED=true
          echo "dmg=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "notarized=$NOTARIZED" >> "$GITHUB_OUTPUT"
          APP=dist/Zipper.app
          {
            echo "## $(basename "$DMG")"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' $APP/Contents/Info.plist) (build $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' $APP/Contents/Info.plist)) |"
            echo "| Architectures | $(lipo -archs $APP/Contents/MacOS/Zipper) |"
            echo "| Signature | $(codesign -dv $APP 2>&1 | grep -m1 -E '^Authority=' | cut -d= -f2- || echo 'ad-hoc') |"
            echo "| Notarized | $NOTARIZED |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$DMG.sha256")\` |"
            echo "| Size | $(du -h "$DMG" | cut -f1) |"
            if [ "$NOTARIZED" != true ]; then
              echo
              echo "Not notarized: macOS blocks it when it's downloaded. To try it, open it once, then allow it in System Settings › Privacy & Security › Open Anyway."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zipper-release-dmg
          path: |
            dist/Zipper-*.dmg
            dist/Zipper-*.dmg.sha256
            dist/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: Draft a GitHub release
    # Only for version tags, and only for notarized builds: an unsigned DMG is never published.
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v') && needs.dmg.outputs.notarized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zipper-release-dmg
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Zipper-*.dmg dist/Zipper-*.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Zipper ${GITHUB_REF_NAME#v}"
